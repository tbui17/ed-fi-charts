services:
  db-ods:
    image: edfialliance/ods-api-db-ods-sandbox:${TAG}
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      TPDM_ENABLED: "${TPDM_ENABLED}"
    volumes:
      - vol-db-ods:/var/lib/postgresql/data
    ports:
      - "5403:5432"
    restart: always
    container_name: ed-fi-db-ods
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      start_period: "60s"
      retries: 3

  db-init:
    image: edfialliance/ods-api-db-ods-sandbox:${TAG}
    depends_on:
      db-ods:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        echo "Waiting for PostgreSQL to be ready..."
        for i in $(seq 1 30); do
          psql -h db-ods -U ${POSTGRES_USER} -tc "SELECT 1" >/dev/null 2>&1 && break
          echo "Attempt $i/30 - waiting 5s..."
          sleep 5
        done
        psql -h db-ods -U ${POSTGRES_USER} -tc "SELECT 1 FROM pg_database WHERE datname='EdFi_Ods_Sandbox_populated'" | grep -q 1 || \
          psql -h db-ods -U ${POSTGRES_USER} -c 'CREATE DATABASE "EdFi_Ods_Sandbox_populated" TEMPLATE "EdFi_Ods_Populated_Template"'
        psql -h db-ods -U ${POSTGRES_USER} -d EdFi_Ods_Sandbox_populated -f /sql/ddl.sql
        psql -h db-ods -U ${POSTGRES_USER} -d EdFi_Ods_Sandbox_populated -f /sql/seed.sql
        psql -h db-ods -U ${POSTGRES_USER} -d EdFi_Ods_Sandbox_populated -f /sql/view_demographics.sql
        echo "DB init complete"
    container_name: ed-fi-db-init
    restart: "no"

  dashboard:
    image: ghcr.io/tbui17/ed-fi-charts:latest
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-ods:5432/EdFi_Ods_Sandbox_populated"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: always
    container_name: ed-fi-dashboard

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS}"
    depends_on:
      - dashboard
    restart: always
    container_name: ed-fi-caddy

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    command: --interval 300
    restart: always
    container_name: watchtower
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  vol-db-ods:
    driver: local
    name: vol-db-ods
  caddy-data:
    driver: local
